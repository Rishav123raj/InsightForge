services:

  backend:
    build: .
    container_name: insightforge-backend

    ports:
      - "8000:8000"

    env_file:
      - .env

    volumes:
      - ./logs:/app/logs

    restart: unless-stopped


  frontend:
    build: ./frontend
    container_name: insightforge-frontend

    ports:
      - "5173:5173"

    depends_on:
      - backend

    restart: unless-stopped